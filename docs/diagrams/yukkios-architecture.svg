<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">YuKKi-OS control and runtime architecture</title>
  <desc id="desc">An ANSI-inspired full-colour architecture map showing data sources entering the authenticated YuKKi-OS control and runtime plane, with Wasmtime, streaming, spatial and native numeric workloads, and a separate BRK1/BRK2 adapter boundary to the Overhauled execution broker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081321"/><stop offset=".55" stop-color="#12102b"/><stop offset="1" stop-color="#071b25"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00d7ff"/><stop offset=".52" stop-color="#9875ff"/><stop offset="1" stop-color="#ffb44b"/></linearGradient>
    <linearGradient id="mesh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e5968"/><stop offset="1" stop-color="#12374e"/></linearGradient>
    <linearGradient id="wasm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#432a73"/><stop offset="1" stop-color="#251c4f"/></linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#66501c"/><stop offset="1" stop-color="#302b1a"/></linearGradient>
    <linearGradient id="broker" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#70401a"/><stop offset="1" stop-color="#392519"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8bb4d0" stroke-opacity=".075" stroke-width="1"/></pattern>
    <marker id="arrowC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#35d9e8"/></marker>
    <marker id="arrowO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#ffbf69"/></marker>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .title{font:700 34px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f3f7ff;letter-spacing:1px}
      .sub{font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#a8bdd1}
      .section{font:700 17px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#dceeff;letter-spacing:1px}
      .cardhead{font:700 17px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#fff}
      .body{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d2dfed}
      .small{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#a8bdd1}
      .cyan{fill:#6cecf1}.violet{fill:#c3a7ff}.gold{fill:#ffd17c}.orange{fill:#ffbd7d}.muted{fill:#91a6ba}
      .card{stroke-width:1.4;rx:14}
    </style>
  </defs>
  <rect width="1400" height="900" rx="24" fill="url(#bg)"/>
  <rect width="1400" height="900" rx="24" fill="url(#grid)"/>
  <rect x="22" y="22" width="1356" height="104" rx="16" fill="#101c31" stroke="url(#head)" stroke-width="2"/>
  <rect x="22" y="22" width="8" height="104" rx="4" fill="url(#head)"/>
  <text x="55" y="67" class="title">YuKKi-OS // CONTROL + RUNTIME PLANE</text>
  <text x="56" y="96" class="sub">v6.13.0 candidate · authenticated coordination · bounded services · portable WASM · broker interoperability</text>
  <text x="1325" y="62" text-anchor="end" class="mono" font-size="13" fill="#6cecf1">ANSI-COLOUR SYSTEM MAP</text>
  <text x="1325" y="88" text-anchor="end" class="mono" font-size="12" fill="#9fb3c8">COORDINATE → VALIDATE → DELEGATE</text>

  <rect x="34" y="148" width="258" height="545" rx="18" fill="#111d2e" stroke="#47708b" stroke-width="1.5"/>
  <text x="58" y="184" class="section">INPUTS / CLIENTS</text>
  <rect x="54" y="208" width="218" height="82" rx="11" fill="#123b4b" stroke="#35d9e8"/>
  <text x="72" y="238" class="cardhead">Peer nodes</text><text x="72" y="262" class="body">bootstrap · register · fleet</text>
  <rect x="54" y="306" width="218" height="82" rx="11" fill="#15394a" stroke="#35d9e8"/>
  <text x="72" y="336" class="cardhead">Stream producers</text><text x="72" y="360" class="body">media · chunks · metadata</text>
  <rect x="54" y="404" width="218" height="82" rx="11" fill="#382d55" stroke="#aa8cff"/>
  <text x="72" y="434" class="cardhead">WASM applications</text><text x="72" y="458" class="body">WASI guests · browser client</text>
  <rect x="54" y="502" width="218" height="82" rx="11" fill="#4b3c1e" stroke="#ffd17c"/>
  <text x="72" y="532" class="cardhead">Multivariate sources</text><text x="72" y="556" class="body">drone · finance · environment</text>
  <text x="58" y="630" class="small">Inputs are validated at their</text><text x="58" y="650" class="small">own protocol / application edge.</text>

  <rect x="314" y="148" width="708" height="545" rx="18" fill="#101a2d" stroke="#35d9e8" stroke-width="2"/>
  <text x="340" y="184" class="section">YUKKI-OS // RUST HOST + COORDINATION</text>
  <rect x="338" y="207" width="316" height="128" rx="12" fill="url(#mesh)" stroke="#35d9e8" class="card"/>
  <text x="360" y="239" class="cardhead">Authenticated peer mesh</text>
  <text x="360" y="266" class="body">X25519 · PSK · HKDF-SHA256</text>
  <text x="360" y="288" class="body">ChaCha20-Poly1305 sessions</text>
  <text x="360" y="314" class="small">Peer control traffic; in-memory registry</text>

  <rect x="680" y="207" width="316" height="128" rx="12" fill="#16374d" stroke="#54bbef" class="card"/>
  <text x="702" y="239" class="cardhead">Streams + gateway</text>
  <text x="702" y="266" class="body">bounded YKMC chunks · registry</text>
  <text x="702" y="288" class="body">HTTP ranges · WebSocket · relay</text>
  <text x="702" y="314" class="small">Codec pass-through; no transcoding</text>

  <rect x="338" y="351" width="316" height="128" rx="12" fill="url(#wasm)" stroke="#aa8cff" class="card"/>
  <text x="360" y="383" class="cardhead">Wasmtime guest host</text>
  <text x="360" y="410" class="body">validation · compilation · isolation</text>
  <text x="360" y="432" class="body">typed multi-module composition</text>
  <text x="360" y="458" class="small">Library APIs; not all exposed via CLI/HTTP</text>

  <rect x="680" y="351" width="316" height="128" rx="12" fill="#19354b" stroke="#55b9e8" class="card"/>
  <text x="702" y="383" class="cardhead">Runtime primitives</text>
  <text x="702" y="410" class="body">bounded MPMC queues</text>
  <text x="702" y="432" class="body">NUMA topology discovery</text>
  <text x="702" y="458" class="small">Not a complete NUMA-aware scheduler</text>

  <rect x="338" y="495" width="316" height="128" rx="12" fill="url(#data)" stroke="#ffd17c" class="card"/>
  <text x="360" y="527" class="cardhead">Spatial + native numerics</text>
  <text x="360" y="554" class="body">browser spatial WASM · transforms</text>
  <text x="360" y="576" class="body">manifest datasets · CPU eigensolver</text>
  <text x="360" y="602" class="small">Eigensolver: real symmetric, dimensions 1–64</text>

  <rect x="680" y="495" width="316" height="128" rx="12" fill="url(#broker)" stroke="#ffbd7d" class="card"/>
  <text x="702" y="527" class="cardhead">Overhauled adapter</text>
  <text x="702" y="554" class="body">BRK1/v1 · BRK2/v2 envelopes</text>
  <text x="702" y="576" class="body">WSM1 task / lifecycle when enabled</text>
  <text x="702" y="602" class="small">Separate TCP boundary; not peer-mesh crypto</text>

  <rect x="1044" y="148" width="322" height="545" rx="18" fill="#201a26" stroke="#ffbd7d" stroke-width="2"/>
  <text x="1068" y="184" class="section">EXTERNAL EXECUTION</text>
  <rect x="1068" y="208" width="274" height="82" rx="11" fill="#543018" stroke="#ffbd7d"/>
  <text x="1088" y="239" class="cardhead">Overhauled broker</text><text x="1088" y="264" class="body">BRK1 / BRK2 · TCP listener</text>
  <rect x="1068" y="306" width="274" height="92" rx="11" fill="#4a2c1d" stroke="#ffbd7d"/>
  <text x="1088" y="337" class="cardhead">Validate + dispatch</text><text x="1088" y="362" class="body">bounded frames · task policy</text><text x="1088" y="382" class="small">response reports actual backend</text>
  <rect x="1068" y="414" width="274" height="112" rx="11" fill="#153e35" stroke="#63dda7"/>
  <text x="1088" y="445" class="cardhead">Execution tiers</text><text x="1088" y="472" class="body">CPU reference baseline</text><text x="1088" y="494" class="body">optional CUDA GPU / NPU</text><text x="1088" y="514" class="small">Ethos-U85: Linux DRM + compatible bundle</text>
  <rect x="1068" y="542" width="274" height="78" rx="11" fill="#34274b" stroke="#b69aff"/>
  <text x="1088" y="572" class="cardhead">BRK2 telemetry</text><text x="1088" y="597" class="body">field 7 backend · selected_gpu</text>
  <text x="1088" y="650" class="small">Unauthenticated wire protocol;</text><text x="1088" y="670" class="small">use a trusted / secured boundary.</text>

  <path d="M292 250H326" stroke="#35d9e8" stroke-width="3" fill="none" marker-end="url(#arrowC)"/>
  <path d="M654 271H674" stroke="#35d9e8" stroke-width="3" fill="none" marker-end="url(#arrowC)"/>
  <path d="M654 416H674" stroke="#aa8cff" stroke-width="3" fill="none" marker-end="url(#arrowC)"/>
  <path d="M996 560H1060" stroke="#ffbd7d" stroke-width="3" fill="none" marker-end="url(#arrowO)"/>
  <text x="1028" y="544" text-anchor="middle" class="small" fill="#ffca8f">BRK1 / BRK2</text>

  <rect x="34" y="720" width="1332" height="145" rx="16" fill="#111b2b" stroke="#62758d" stroke-width="1.2"/>
  <text x="58" y="753" class="section">BENCHMARK BRIDGE // IMPORTANT DISTINCTION</text>
  <path d="M58 775H1342" stroke="#34455a"/>
  <text x="60" y="805" class="body"><tspan fill="#6cecf1" font-weight="700">LOCAL WASM</tspan><tspan>  Spatial work runs in Node's WebAssembly runtime.</tspan></text>
  <text x="60" y="832" class="body"><tspan fill="#ffbd7d" font-weight="700">DIRECT BRK2</tspan><tspan>  Host-prepared numeric fixture records optionally go to the broker.</tspan></text>
  <text x="790" y="805" class="body"><tspan fill="#c3a7ff" font-weight="700">NOT WSM1</tspan><tspan>  This benchmark does not run guest compilation or lifecycle.</tspan></text>
  <text x="790" y="832" class="body"><tspan fill="#ffd17c" font-weight="700">NOT A CLAIM</tspan><tspan>  No browser rendering, physical accelerator or power result implied.</tspan></text>
</svg>