<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="924" viewBox="0 0 1440 924" role="img" aria-labelledby="title desc"><title id="title">YuKKi-OS // CONTROL + WORKLOAD POLICY</title><desc id="desc">YuKKi-OS owns authenticated peer-mesh lease gossip discovery, workload semantics, topology policy and advisory BRK2 hints. Overhauled owns broker-local queues, CPU placement, backend dispatch and telemetry. NUMA memory placement and hard real-time remain unqualified.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081522"/><stop offset=".6" stop-color="#17112e"/><stop offset="1" stop-color="#09222a"/></linearGradient><linearGradient id="hd"><stop stop-color="#00d9ff"/><stop offset=".55" stop-color="#a47bff"/><stop offset="1" stop-color="#ffb25d"/></linearGradient><pattern id="gr" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#9ab3ca" stroke-opacity=".07"/></pattern><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{font-size:29px;font-weight:700;fill:#f4f7ff}.s{font-size:13.5px;fill:#aebfd0}.sec{font-size:15px;font-weight:700;letter-spacing:1px;fill:#e0edff}.ch{font-weight:700;fill:#fff}.b{fill:#d8e4ef}.sm{font-size:10.8px;fill:#a8bacb}</style></defs><rect width="1440" height="900" rx="22" fill="url(#bg)"/><rect width="1440" height="900" rx="22" fill="url(#gr)"/><rect x="20" y="20" width="1400" height="92" rx="14" fill="#101d31" stroke="url(#hd)" stroke-width="2"/><text x="48" y="58" class="h">YuKKi-OS // CONTROL + WORKLOAD POLICY</text><text x="50" y="86" class="s">v6.15.0 candidate · authenticate · resolve · classify · load-aware delegation</text><text x="1390" y="58" text-anchor="end" font-size="12" fill="#6cecf1">ANSI TRUE-COLOUR MAP</text><rect x="24" y="132" width="205" height="620" rx="15" fill="#111d2e" stroke="#54738a"/><text x="44" y="164" class="sec">INPUTS</text><rect x="42" y="184" width="169" height="76" rx="11" fill="#123d4d" stroke="#4dd9eb" stroke-width="1.4"/><text x="60" y="212" class="ch" font-size="13">Peer mesh</text><text x="60" y="236" class="b" font-size="11">bootstrap · fleet</text><rect x="42" y="275" width="169" height="76" rx="11" fill="#15394b" stroke="#62bfe9" stroke-width="1.4"/><text x="60" y="303" class="ch" font-size="13">Streams</text><text x="60" y="327" class="b" font-size="11">media · gateway</text><rect x="42" y="366" width="169" height="76" rx="11" fill="#382d55" stroke="#b69aff" stroke-width="1.4"/><text x="60" y="394" class="ch" font-size="13">WASM workloads</text><text x="60" y="418" class="b" font-size="11">WASI · browser</text><rect x="42" y="457" width="169" height="76" rx="11" fill="#4a3b1d" stroke="#ffd17c" stroke-width="1.4"/><text x="60" y="485" class="ch" font-size="13">Data sources</text><text x="60" y="509" class="b" font-size="11">drone · finance · env</text><rect x="42" y="548" width="169" height="76" rx="11" fill="#29384a" stroke="#8eb3d7" stroke-width="1.4"/><text x="60" y="576" class="ch" font-size="13">Applications</text><text x="60" y="600" class="b" font-size="11">native APIs</text><text x="44" y="665" class="sm">Source schemas, units, time</text><text x="44" y="685" class="sm">and provenance stay at the</text><text x="44" y="705" class="sm">application validation edge.</text><rect x="250" y="132" width="600" height="620" rx="15" fill="#101a2d" stroke="#41d7e8" stroke-width="2"/><text x="272" y="164" class="sec">YUKKI-OS // SEMANTICS + HOST</text><rect x="272" y="184" width="274" height="88" rx="11" fill="#104354" stroke="#42d8e8" stroke-width="1.4"/><text x="290" y="212" class="ch" font-size="16">Authenticated mesh</text><text x="290" y="236" class="b" font-size="12.5">X25519 · PSK · HKDF · AEAD</text><text x="290" y="260" class="sm">broker service leases · 90s refresh · 8-hop gossip</text><rect x="560" y="184" width="268" height="88" rx="11" fill="#18374e" stroke="#5abfe9" stroke-width="1.4"/><text x="578" y="212" class="ch" font-size="16">Streams + gateway</text><text x="578" y="236" class="b" font-size="12.5">YKMC · registry · relay · HTTP</text><rect x="272" y="284" width="274" height="88" rx="11" fill="#38285f" stroke="#ac8aff" stroke-width="1.4"/><text x="290" y="312" class="ch" font-size="16">Wasmtime host</text><text x="290" y="336" class="b" font-size="12.5">validate · compile · isolate · compose</text><rect x="560" y="284" width="268" height="88" rx="11" fill="#4a3a1d" stroke="#ffd17c" stroke-width="1.4"/><text x="578" y="312" class="ch" font-size="16">Spatiotemporal + numerics</text><text x="578" y="336" class="b" font-size="12.5">NXR1 resolver · datasets · CPU eigensolver</text><rect x="272" y="384" width="556" height="202" rx="12" fill="#1c263d" stroke="#a58aff"/><text x="292" y="414" class="ch" font-size="15">WorkerDirective // YuKKi chooses workload meaning</text><text x="292" y="436" class="sm">TaskProfile + NXR1 resolver → validated class / affinity hints</text><rect x="292" y="450" width="94" height="34" rx="7" fill="#174154" stroke="#55ddeb"/><text x="339" y="472" text-anchor="middle" class="b">Control</text><rect x="393" y="450" width="126" height="34" rx="7" fill="#493060" stroke="#b69aff"/><text x="456" y="472" text-anchor="middle" class="b">RealtimeSpatial</text><rect x="526" y="450" width="96" height="34" rx="7" fill="#4c3b1e" stroke="#ffd17c"/><text x="574" y="472" text-anchor="middle" class="b">Throughput</text><rect x="629" y="450" width="86" height="34" rx="7" fill="#244238" stroke="#73d9a8"/><text x="672" y="472" text-anchor="middle" class="b">ExactCpu</text><rect x="722" y="450" width="86" height="34" rx="7" fill="#203f65" stroke="#70b6ff"/><text x="765" y="472" text-anchor="middle" class="b">Inference</text><text x="292" y="512" class="b" font-size="12.2">BRK2: 9 deadline · 10 device · 11 class · 12 affinity · 13 NUMA hint</text><text x="292" y="536" class="b" font-size="12.2">AllowAll bypasses sequence locks; strict ordering is per source</text><text x="292" y="561" class="sm">Strict sequence state capped at 65,536 sources per route</text><rect x="272" y="600" width="556" height="126" rx="11" fill="#183348" stroke="#62b9e4" stroke-width="1.4"/><text x="290" y="628" class="ch" font-size="16">Resolver + scheduler + runtime</text><text x="290" y="652" class="b" font-size="12">YuKKi selects locality policy; current BRK2 sends CPU-affinity hints only.</text><text x="290" y="674" class="b" font-size="12">Replica ranking combines service-time EWMA, active load and locality.</text><text x="290" y="696" class="b" font-size="12">Memory placement needs a negotiated policy + honored / rejected / fallback result.</text><rect x="870" y="132" width="546" height="620" rx="15" fill="#201a27" stroke="#ffbd7d" stroke-width="2"/><text x="892" y="164" class="sec">OVERHAULED // LOCAL EXECUTION</text><rect x="892" y="184" width="502" height="68" rx="11" fill="#533018" stroke="#ffbd7d" stroke-width="1.4"/><text x="910" y="212" class="ch" font-size="16">BRK1 / BRK2 ingress</text><text x="910" y="236" class="b" font-size="12">bounded frames · optional BRK2 worker intent / hints</text><rect x="892" y="264" width="502" height="150" rx="11" fill="#342846" stroke="#b69aff" stroke-width="1.4"/><text x="910" y="292" class="ch" font-size="16">Five isolated worker-class queues</text><text x="910" y="316" class="b" font-size="12">reserved pools · bounded admission</text><text x="910" y="337" class="b" font-size="12">RealtimeSpatial: EDF with deadline, otherwise FIFO</text><text x="910" y="358" class="b" font-size="12">other classes: FIFO · no cross-class global order</text><text x="910" y="379" class="b" font-size="12">class isolation protects reserved control / real-time workers</text><rect x="892" y="426" width="502" height="116" rx="11" fill="#15404a" stroke="#55ddeb" stroke-width="1.4"/><text x="910" y="454" class="ch" font-size="16">Broker-local Linux CPU affinity</text><text x="910" y="478" class="b" font-size="12">sysfs node CPU lists ∩ process-allowed CPU mask</text><text x="910" y="500" class="b" font-size="12">best-effort pthread pin · report node only on success</text><text x="910" y="522" class="b" font-size="12">unsupported / restricted hosts make no pinning claim</text><rect x="892" y="554" width="502" height="88" rx="11" fill="#193d32" stroke="#63dda7" stroke-width="1.4"/><text x="910" y="582" class="ch" font-size="16">Backend dispatch</text><text x="910" y="606" class="b" font-size="12">CPU baseline · CUDA GPU / Placer · optional NPU</text><rect x="892" y="654" width="502" height="72" rx="11" fill="#28223b" stroke="#b69aff" stroke-width="1.4"/><text x="910" y="682" class="ch" font-size="16">BRK2 response telemetry</text><text x="910" y="706" class="b" font-size="12">field 7 backend · fields 8–12 worker / queue / NUMA</text><path d="M229 222H242" stroke="#44dae8" stroke-width="3"/><path d="M850 486H862" stroke="#ffbf72" stroke-width="3"/><rect x="24" y="776" width="1392" height="132" rx="13" fill="#111c2d" stroke="#647990"/><text x="46" y="805" class="sec">SPLIT NUMA OWNERSHIP // HINT IS NOT PLACEMENT</text><text x="46" y="833" class="b" font-size="12.5"><tspan fill="#6cecf1" font-weight="700">YUKKI-OS:</tspan><tspan> class + logical affinity + advisory preferred-node hint + deadline.</tspan></text><text x="720" y="833" class="b" font-size="12.5"><tspan fill="#ffbd7d" font-weight="700">OVERHAULED:</tspan><tspan> local CPU discovery + best-effort pin + applied-node telemetry.</tspan></text><text x="46" y="856" class="sm">No NUMA-local allocation or hard-real-time guarantee. Direct benchmark BRK2 is not WSM1 guest execution.</text><text x="46" y="878" class="sm">Discovery is bounded lease gossip, not Kademlia; bootstrap cache is in-memory and broker is not a DHT peer.</text><text x="46" y="900" class="sm">RealtimeSpatial is cooperative EDF; hard RT needs a qualified kernel, memory, IRQ and WCET profile.</text></svg>