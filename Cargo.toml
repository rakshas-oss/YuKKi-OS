[package]
name = "yukkios_6_4_interim"
version = "6.4.3"
edition = "2021"
authors = ["Aditya Muralidhar <Rakshas International Unlimited>"]
description = "YuKKi OS 6.4.3 Out-of-Band Integrity Edition — OOB Rolling Hash, 60-Frame Sync, Node Quarantine, ChaCha20 Payload Binding"

[dependencies]
tokio = { version = "1", features = ["full", "process"] }
tokio-tungstenite = "0.20"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }

[build-dependencies]
cc = "1.0"
