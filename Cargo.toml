[package]
name = "yukkios"
version = "6.21.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Modular Rust distributed-systems runtime for peer coordination, workload orchestration, and WebAssembly composition"
homepage = "https://github.com/rakshas-oss/YuKKi-OS"
repository = "https://github.com/rakshas-oss/YuKKi-OS"
readme = "README.md"
keywords = ["distributed", "runtime", "wasm", "networking", "concurrency"]
categories = ["network-programming", "wasm", "concurrency", "asynchronous"]
include = ["Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "LICENSES.md", "build.rs", "src/**", "kernel/**", "include/**", "protocol/**"]

[lib]
name = "yukkios"
path = "src/lib.rs"

[[bin]]
name = "yukki_core_node"
path = "src/main.rs"

[[bin]]
name = "yukki_dataset_bench"
path = "src/bin/yukki_dataset_bench.rs"

[[bin]]
name = "yukki_eigensolver_bench"
path = "src/bin/yukki_eigensolver_bench.rs"

[[bin]]
name = "yukki_crawl"
path = "src/bin/yukki_crawl.rs"

[features]
default = []
mesh_dashboard = ["dep:rstar"]
interop_encryption = []
native-crypto = []

[dependencies]
byteorder = "1.5"
tokio = { version = "1", features = ["full", "process"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
x25519-dalek = { version = "3.0", features = ["static_secrets"] }
chacha20poly1305 = "0.11"
rand_core = { version = "0.6", features = ["getrandom", "std"] }
wasmtime = { version = "51.0", default-features = false, features = [
    "anyhow",
    "async",
    "backtrace",
    "gc",
    "gc-copying",
    "gc-drc",
    "gc-null",
    "wat",
    "profiling",
    "parallel-compilation",
    "cranelift",
    "pooling-allocator",
    "demangle",
    "addr2line",
    "coredump",
    "debug-builtins",
    "runtime",
    "component-model",
    "component-model-async",
    "threads",
    "stack-switching",
    "std",
    "debug",
    "compile-time-builtins",
    "wit-parser",
] }
zeroize = { version = "1.9", features = ["derive"] }
hkdf = "0.13"
sha2 = "0.11"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
axum = { version = "0.8.9", features = ["json", "ws"] }
tokio-tungstenite = "0.30.0"
rstar = { version = "0.14", optional = true }

# Enable getrandom's JavaScript backend only for wasm32 builds.
# This satisfies getrandom 0.4 users without changing native targets.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
wat = "1"

[[bench]]
name = "adi_benchmarks"
harness = false

[[bench]]
name = "crypto_benchmarks"
harness = false

[[bench]]
name = "frame_benchmarks"
harness = false

[build-dependencies]
cc = "1.0"
