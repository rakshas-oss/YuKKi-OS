[package]
name = "yukkios_6_8_0_inet3"
version = "6.9.3"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "yukkios_6_8_0_inet3"
path = "src/lib.rs"

[[bin]]
name = "yukki_core_node"
path = "src/main.rs"

[features]
default = []
mesh_dashboard = ["dep:rstar", "dep:serde_cbor"]

[dependencies]
byteorder = "1.5"
tokio = { version = "1", features = ["full", "process"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
x25519-dalek = { version = "3.0", features = ["static_secrets"] }
chacha20poly1305 = "0.11"
rand_core = { version = "0.6", features = ["getrandom", "std"] }
wasmtime = "49.0"
zeroize = { version = "1.9", features = ["derive"] }
hkdf = "0.13"
sha2 = "0.11"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
axum = { version = "0.8.9", features = ["json", "ws"] }
tokio-tungstenite = "0.29.0"
rstar = { version = "0.12", optional = true }
serde_cbor = { version = "0.11", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
wat = "1"

[[bench]]
name = "adi_benchmarks"
harness = false

[[bench]]
name = "crypto_benchmarks"
harness = false

[[bench]]
name = "frame_benchmarks"
harness = false

[build-dependencies]
cc = "1.0"
