[package]
name = "yukkios"
version = "6.9.9"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "yukkios"
path = "src/lib.rs"

[[bin]]
name = "yukki_core_node"
path = "src/main.rs"

[features]
default = []
mesh_dashboard = ["dep:rstar", "dep:serde_cbor"]
interop_encryption = []
native-crypto = []

[dependencies]
byteorder = "1.5"
tokio = { version = "1", features = ["full", "process"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
x25519-dalek = { version = "3.0", features = ["static_secrets"] }
chacha20poly1305 = "0.11"
rand_core = { version = "0.6", features = ["getrandom", "std"] }
wasmtime = { version = "50.0", default-features = false, features = [
    "anyhow",
    "async",
    "backtrace",
    "gc",
    "gc-copying",
    "gc-drc",
    "gc-null",
    "wat",
    "profiling",
    "parallel-compilation",
    "cranelift",
    "pooling-allocator",
    "demangle",
    "addr2line",
    "coredump",
    "debug-builtins",
    "runtime",
    "component-model",
    "component-model-async",
    "threads",
    "stack-switching",
    "std",
    "debug",
    "compile-time-builtins",
    "wit-parser",
] }
zeroize = { version = "1.9", features = ["derive"] }
hkdf = "0.13"
sha2 = "0.11"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
axum = { version = "0.8.9", features = ["json", "ws"] }
tokio-tungstenite = "0.30.0"
rstar = { version = "0.13", optional = true }
serde_cbor = { version = "0.11", optional = true }

# Enable getrandom's JavaScript backend only for wasm32 builds.
# This satisfies getrandom 0.4 users without changing native targets.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
wat = "1"

[[bench]]
name = "adi_benchmarks"
harness = false

[[bench]]
name = "crypto_benchmarks"
harness = false

[[bench]]
name = "frame_benchmarks"
harness = false

[build-dependencies]
cc = "1.0"
