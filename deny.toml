[graph]
all-features = true

[licenses]
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "0BSD",
  "CC0-1.0",
]
exceptions = [
  { name = "yukkios_6_8_0_inet3", allow = ["GPL-3.0-only"] },
  { name = "yukki_guest_worker", allow = ["GPL-3.0-only"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"
