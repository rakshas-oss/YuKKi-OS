[graph]
all-features = true

[licenses]
unlicensed = "deny"
default = "deny"
confidence-threshold = 0.93

# Dependencies must be permissive
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-DFS-2016",
  "0BSD",
  "CC0-1.0",
]

# Copyleft is disallowed in dependencies
deny = [
  "GPL-2.0",
  "GPL-2.0-only",
  "GPL-2.0-or-later",
  "GPL-3.0",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "LGPL-2.0",
  "LGPL-2.0-only",
  "LGPL-2.0-or-later",
  "LGPL-2.1",
  "LGPL-2.1-only",
  "LGPL-2.1-or-later",
  "LGPL-3.0",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  "AGPL-3.0",
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
]

# Permit your own project crates to remain GPL
exceptions = [
  { name = "yukkios_6_8_0_inet3", allow = ["GPL-3.0-only"] },
  { name = "yukki_guest_worker", allow = ["GPL-3.0-only"] },
]

# Resolve multi-license dependency choices to permissive alternatives
[[licenses.clarify]]
name = "ittapi"
version = "0.4.0"
expression = "BSD-3-Clause"
license-files = []

[[licenses.clarify]]
name = "ittapi-sys"
version = "0.4.0"
expression = "BSD-3-Clause"
license-files = []

[[licenses.clarify]]
name = "r-efi"
version = "5.3.0"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "r-efi"
version = "6.0.0"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[advisories]
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
ignore = []
