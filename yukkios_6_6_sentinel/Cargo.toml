[package]
name = "yukkios_6_6_sentinel"
version = "6.6.0"
edition = "2021"
authors = ["Aditya Muralidhar <Rakshas International Unlimited>"]
description = "YuKKi OS 6.6.0 Sentinel Mesh Edition — X25519 ECDH, AEAD framed TCP, ChaCha20 polymorphic payload weave, Lorenz attractor data plane, dual-layer sentinel quarantine"

[[bin]]
name = "yukki_sentinel"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
rand = "0.8"
anyhow = "1"

[build-dependencies]
cc = "1.0"
