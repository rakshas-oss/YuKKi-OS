name: YuKKi-OS CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  verify:
    name: Verify YuKKi-OS (Rust & Wasm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Formatting
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --locked

      - name: Run Guest Worker Wasm Tests
        run: cargo test --manifest-path guest-worker/Cargo.toml --locked

      - name: Run Browser Wasm Tests
        run: cargo test --manifest-path browser-wasm/Cargo.toml --locked
