name: Refresh Wasmtime security lockfile

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/refresh-wasmtime-lockfile.yml"
      - "Cargo.toml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh-wasmtime-lockfile-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  refresh-and-verify:
    name: Resolve, verify, and commit patched Wasmtime lockfile
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Install Rust stable and WebAssembly targets
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - name: Ensure WASI and browser WebAssembly targets are installed
        run: rustup target add wasm32-wasip1 wasm32-unknown-unknown

      - name: Update Wasmtime to patched release using Cargo
        run: cargo update -p wasmtime --precise 50.0.3

      - name: Update vulnerable URL parser to patched release
        run: cargo update -p url --precise 2.5.9

      - name: Verify rand serde attack surface
        run: |
          cargo tree --locked -e features -i rand@0.9.5 | tee /tmp/rand-0.9.5-features.txt
          if grep -F 'rand feature "serde"' /tmp/rand-0.9.5-features.txt; then
            echo "rand 0.9.5 serde support is enabled; this Aikido finding must be remediated before merge." >&2
            exit 1
          fi
          echo "rand 0.9.5 is present through Axum WebSocket support without the affected serde feature."

      - name: Regenerate canonical workspace lockfile from manifests
        # Resolve manifest and security updates with Cargo before downstream --locked checks.
        run: cargo check --workspace

      - name: Confirm resolved Wasmtime version
        run: |
          cargo tree -i wasmtime --locked
          grep -A2 '^name = "wasmtime"$' Cargo.lock

      - name: Apply canonical Rust formatting
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo fmt --manifest-path browser-wasm/Cargo.toml
          cargo fmt --manifest-path browser-wasm/Cargo.toml -- --check

      - name: Check native dependency graph
        run: cargo check --all-targets --locked

      - name: Run complete native test suite
        run: cargo test --all-targets --locked --verbose

      - name: Run Clippy with warnings denied
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run RustSec audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings

      - name: Build and test WASI guest worker
        working-directory: guest-worker
        run: |
          cargo build --release --locked --target wasm32-wasip1
          cargo test --locked

      - name: Validate browser WASM application
        run: |
          cargo test --manifest-path browser-wasm/Cargo.toml --locked
          cargo clippy --manifest-path browser-wasm/Cargo.toml --locked --target wasm32-unknown-unknown -- -D warnings
          cargo build --manifest-path browser-wasm/Cargo.toml --release --locked --target wasm32-unknown-unknown

      - name: Commit verified dependency and formatting updates to main
        if: success()
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No dependency or formatting changes are required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add Cargo.lock
          git commit -m "fix: refresh Wasmtime security patches and Rust formatting"
          git push origin HEAD:main
