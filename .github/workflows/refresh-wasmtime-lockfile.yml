name: Validate Wasmtime security lockfile

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/refresh-wasmtime-lockfile.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/check-cargo-lockfiles.sh"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/refresh-wasmtime-lockfile.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/check-cargo-lockfiles.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasmtime-lock-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-audit:
    name: Validate pinned dependency graph without rewriting main
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Verify all checked-in lockfiles
        run: bash scripts/check-cargo-lockfiles.sh
      - name: Validate locked workspace metadata and dependencies
        run: |
          cargo +1.98.1 metadata --format-version 1 --locked
          cargo +1.98.1 check --workspace --all-targets --locked
      - name: Confirm manifest-compatible Wasmtime and patched URL versions
        run: |
          cargo +1.98.1 tree --locked -i wasmtime
          cargo +1.98.1 tree --locked -i url
          python3 - <<'PY'
          import tomllib
          with open("Cargo.lock", "rb") as handle:
              lock = tomllib.load(handle)
          versions = {p["name"]: p["version"] for p in lock["package"] if p["name"] in {"wasmtime", "url"}}
          if versions.get("wasmtime") != "51.0.0":
              raise SystemExit(f"Unexpected Wasmtime lock version: {versions.get('wasmtime')}")
          if versions.get("url") != "2.5.9":
              raise SystemExit(f"Unexpected url lock version: {versions.get('url')}")
          PY
      - name: Verify rand serde feature is not enabled
        run: |
          cargo +1.98.1 tree --locked -e features -i rand@0.9.5 | tee /tmp/rand-features.txt
          if grep -F 'rand feature "serde"' /tmp/rand-features.txt; then
            echo "Affected rand serde feature is enabled; investigate rather than suppressing the finding." >&2
            exit 1
          fi
      - name: Verify formatting, tests and Clippy
        run: |
          cargo +1.98.1 fmt --all -- --check
          cargo +1.98.1 test --all-targets --locked
          cargo +1.98.1 clippy --all-targets --locked -- -D warnings
      - name: Run RustSec audit
        run: |
          cargo +1.98.1 install cargo-audit --locked
          cargo +1.98.1 audit --deny warnings
      - name: Validate standalone WASM packages
        run: |
          rustup target add wasm32-wasip1 wasm32-unknown-unknown --toolchain 1.98.1
          cargo +1.98.1 test --manifest-path crawler-wasm/Cargo.toml --locked
          cargo +1.98.1 build --manifest-path crawler-wasm/Cargo.toml --release --locked --target wasm32-unknown-unknown
          cargo +1.98.1 test --manifest-path browser-wasm/Cargo.toml --locked
          cargo +1.98.1 build --manifest-path guest-worker/Cargo.toml --release --locked --target wasm32-wasip1
