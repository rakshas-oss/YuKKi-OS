name: Refresh Cargo Lockfile

on:
  push:
    branches:
      - fix/overhauled-live-cpp-interop

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Regenerate lockfile from the manifest
        run: cargo check --features mesh_dashboard --lib
      - name: Commit the regenerated lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(deps): regenerate Cargo.lock"
          git push
