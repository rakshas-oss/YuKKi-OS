name: WASM Crawler

on:
  pull_request:
    branches: ["main"]
    paths:
      - "src/crawler.rs"
      - "src/crawler_wasm.rs"
      - "src/bin/yukki_crawl.rs"
      - "crawler-wasm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/crawler-wasm.yml"
  push:
    branches: ["main"]
    paths:
      - "src/crawler.rs"
      - "src/crawler_wasm.rs"
      - "src/bin/yukki_crawl.rs"
      - "crawler-wasm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/crawler-wasm.yml"

permissions:
  contents: read

concurrency:
  group: wasm-crawler
  cancel-in-progress: true

jobs:
  host:
    name: Native crawler and sandbox tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify lockfiles
        run: |
          cargo metadata --format-version 1 --locked
          cargo metadata --manifest-path crawler-wasm/Cargo.toml --format-version 1 --locked
      - name: Test crawler, WASM ABI and all targets
        run: cargo test --all-targets --locked
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  guest:
    name: Build no-std extraction guest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install WASM target for the pinned Rust toolchain
        run: rustup target add wasm32-unknown-unknown --toolchain 1.98.1
      - name: Build sandboxed HTML extractor
        run: cargo build --manifest-path crawler-wasm/Cargo.toml --target wasm32-unknown-unknown --release --locked
      - name: Verify WebAssembly artifact exists and is bounded
        run: |
          test -s crawler-wasm/target/wasm32-unknown-unknown/release/yukkios_crawler_wasm.wasm
          test "$(stat -c %s crawler-wasm/target/wasm32-unknown-unknown/release/yukkios_crawler_wasm.wasm)" -le 4194304
