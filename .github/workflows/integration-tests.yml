name: Integration Tests

on:
  push:
    branches: ["main", "copilot/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mesh-integration:
    name: P2P Mesh & Network Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve root Cargo dependency graph
        shell: bash
        run: cargo metadata --format-version=1 > /dev/null
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run mesh integration tests
        run: cargo test --test integration_tests mesh -- --nocapture

  crypto-integration:
    name: Cryptography Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve root Cargo dependency graph
        shell: bash
        run: cargo metadata --format-version=1 > /dev/null
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run crypto integration tests
        run: cargo test --test integration_tests encryption -- --nocapture

  abi-ffi:
    name: ABI Stability & FFI Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve root Cargo dependency graph
        shell: bash
        run: cargo metadata --format-version=1 > /dev/null
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run ABI/FFI tests
        run: cargo test --test integration_tests frame -- --nocapture

  wasm-sandbox:
    name: WebAssembly Sandbox Isolation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve root Cargo dependency graph
        shell: bash
        run: cargo metadata --format-version=1 > /dev/null
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run WASM sandbox tests
        run: cargo test --test test_wasm_sandbox -- --nocapture

  adi-calibration:
    name: ADI Hardware Calibration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve root Cargo dependency graph
        shell: bash
        run: cargo metadata --format-version=1 > /dev/null
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run ADI calibration tests
        run: cargo test --test test_adi_auto_tune -- --nocapture

  gpu-wasm-adapter:
    name: GPU WASM Adapter & Lifecycle Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve root Cargo dependency graph
        shell: bash
        run: cargo metadata --format-version=1 > /dev/null
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run GPU WASM adapter tests
        run: cargo test --test test_gpu_adapter -- --nocapture

  all-integration:
    name: All Integration Tests
    runs-on: ubuntu-latest
    needs: [mesh-integration, crypto-integration, abi-ffi, wasm-sandbox, adi-calibration, gpu-wasm-adapter, overhauled-live-cpp]
    steps:
      - run: echo "All integration tests passed"

  overhauled-live-cpp:
    name: Live C++ overhauled BRK1/BRK2 WSM1 interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: rakshas-oss/overhauled
          ref: main
          path: overhauled
      - name: Record canonical interoperability revisions
        run: |
          echo "YuKKi-OS: $(git rev-parse HEAD)"
          echo "overhauled: $(git -C overhauled rev-parse HEAD)"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Resolve root Cargo dependency graph
        shell: bash
        run: cargo metadata --format-version=1 > /dev/null
      - name: Install C++ build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Build the real CPU-only broker and BRK2 test
        run: |
          cmake -S overhauled -B overhauled/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_CUDA=OFF \
            -DENABLE_TENSORRT=OFF \
            -DBUILD_BROKER=ON \
            -DBUILD_EXAMPLES=OFF
          cmake --build overhauled/build --target broker_server brk2_protocol_test brk_conformance_test --parallel 2
      - name: Verify mirrored conformance corpus
        run: cmp tests/fixtures/protocol/brk-conformance-v1.corpus overhauled/tests/fixtures/protocol/brk-conformance-v1.corpus
      - name: Run Rust shared BRK conformance corpus
        run: cargo test --locked --test brk_conformance -- --nocapture
      - name: Run C++ BRK conformance tests
        run: ctest --test-dir overhauled/build --output-on-failure -R '^(brk2_protocol_test|brk_conformance_test)$'
      - name: Run live Rust-to-C++ BRK1 and BRK2 round trips
        env:
          OVERHAULED_BROKER_ENDPOINT: 127.0.0.1:19090
        run: |
          set -euo pipefail
          overhauled/build/broker_server 19090 --cpu-only > /tmp/overhauled-broker.log 2>&1 &
          broker_pid=$!
          trap 'kill "$broker_pid" 2>/dev/null || true; wait "$broker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if (echo > /dev/tcp/127.0.0.1/19090) >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$broker_pid" 2>/dev/null; then
              cat /tmp/overhauled-broker.log
              exit 1
            fi
            sleep 0.25
          done
          OVERHAULED_WIRE_MODE=brk1 cargo test --locked --test test_overhauled_live -- --nocapture
          OVERHAULED_WIRE_MODE=brk2 cargo test --locked --test test_overhauled_live -- --nocapture
      - name: Run live BRK2 NPU execution and CPU fallback
        env:
          OVERHAULED_NPU_BROKER_ENDPOINT: 127.0.0.1:19091
          OVERHAULED_CPU_FALLBACK_ENDPOINT: 127.0.0.1:19092
        run: |
          set -euo pipefail
          overhauled/build/broker_server 19091 --npu-simulated > /tmp/overhauled-npu-broker.log 2>&1 &
          npu_pid=$!
          overhauled/build/broker_server 19092 > /tmp/overhauled-cpu-fallback-broker.log 2>&1 &
          cpu_pid=$!
          trap 'kill "$npu_pid" "$cpu_pid" 2>/dev/null || true; wait "$npu_pid" 2>/dev/null || true; wait "$cpu_pid" 2>/dev/null || true' EXIT
          for port in 19091 19092; do
            ready=false
            for attempt in $(seq 1 40); do
              if (echo > "/dev/tcp/127.0.0.1/$port") >/dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 0.25
            done
            if [[ "$ready" != true ]]; then
              cat /tmp/overhauled-npu-broker.log
              cat /tmp/overhauled-cpu-fallback-broker.log
              exit 1
            fi
          done
          cargo test --locked --test test_overhauled_npu_live -- --nocapture
