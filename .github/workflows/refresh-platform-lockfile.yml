name: Refresh Cargo lockfile for platform qualification

on:
  push:
    branches:
      - platform/msvc-windows-wasi-guest

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate lockfile after removing invalid same-source patches
        run: cargo generate-lockfile
      - name: Commit refreshed lockfile to this qualification branch
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: refresh Cargo.lock after dependency patch removal"
          git push origin "HEAD:${GITHUB_REF_NAME}"
