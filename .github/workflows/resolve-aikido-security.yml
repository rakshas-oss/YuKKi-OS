name: Aikido finding regression guard

on:
  push:
    branches: ["fix/aikido-security-findings"]
  pull_request:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crawler-wasm/**"
      - "tests/**"
      - ".github/workflows/resolve-aikido-security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aikido-security-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-security-regressions:
    name: Verify dependency and parser security invariants
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Verify checked-in dependency graph
        run: bash scripts/check-cargo-lockfiles.sh
      - name: Verify affected dependency features and patched URL parser
        run: |
          cargo +1.98.1 tree --locked -e features -i rand@0.9.5 | tee /tmp/rand-features.txt
          if grep -F 'rand feature "serde"' /tmp/rand-features.txt; then
            echo "rand serde feature is enabled; do not dismiss the reported attack surface." >&2
            exit 1
          fi
          cargo +1.98.1 tree --locked -i url
          grep -A2 '^name = "url"$' Cargo.lock
      - name: Run locked tests and strict lint
        run: |
          cargo +1.98.1 fmt --all -- --check
          cargo +1.98.1 check --workspace --all-targets --locked
          cargo +1.98.1 test --all-targets --locked
          cargo +1.98.1 clippy --all-targets --locked -- -D warnings
      - name: Run dependency vulnerability audit
        run: |
          cargo +1.98.1 install cargo-audit --locked
          cargo +1.98.1 audit --deny warnings
      - name: Validate crawler sandbox and user-selected processor tests
        run: cargo +1.98.1 test --locked crawler
