name: Publish yukkios to crates.io

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published YuKKi-OS release tag to publish (must match Cargo.toml)"
        required: true
        type: string
        default: "v6.22.0"
      auth_method:
        description: "Use crates.io Trusted Publishing or the bootstrap API token"
        required: true
        type: choice
        options:
          - trusted
          - token
        default: trusted

permissions:
  contents: read

concurrency:
  group: crates-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify immutable release and crate contents
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Verify release ancestry, exact version and unchanged package contents
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" HEAD
          tag_version="${RELEASE_TAG#v}"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$version" = "$tag_version"
          if ! git diff --quiet "refs/tags/$RELEASE_TAG..HEAD" --             Cargo.toml Cargo.lock README.md LICENSE LICENSES.md build.rs             src/ kernel/ include/ protocol/ examples/; then
            echo "::error::Packaged source or metadata changed after the selected release tag."
            exit 1
          fi
          echo "Verified release tag $RELEASE_TAG for yukkios $version."
      - name: Validate package metadata and archive
        run: |
          cargo +1.98.1 metadata --no-deps --format-version 1 --locked
          cargo +1.98.1 package --locked --list
          cargo +1.98.1 package --locked
      - name: Verify crates.io package identity and version are unused
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          name = "yukkios"
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          url = f"https://crates.io/api/v1/crates/{name}"
          request = urllib.request.Request(url, headers={"User-Agent": "rakshas-oss-yukkios-publisher"})
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print(f"{name} is not registered; bootstrap publication may proceed.")
                  raise SystemExit(0)
              raise
          crate = data["crate"]
          repository = (crate.get("repository") or "").rstrip("/")
          expected = "https://github.com/rakshas-oss/YuKKi-OS"
          if repository.lower() != expected.lower():
              raise SystemExit(f"Crate name {name!r} belongs to a different project: {repository!r}")
          if version in {item["num"] for item in data.get("versions", [])}:
              raise SystemExit(f"{name} {version} is already published; refusing duplicate upload.")
          print(f"Confirmed repository ownership and unused version {version}.")
          PY

  publish-trusted:
    name: Publish with crates.io Trusted Publishing
    needs: verify-release
    if: ${{ github.ref == 'refs/heads/main' && inputs.auth_method == 'trusted' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Obtain short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish verified crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo +1.98.1 publish --locked

  publish-token:
    name: Publish with bootstrap API token
    needs: verify-release
    if: ${{ github.ref == 'refs/heads/main' && inputs.auth_method == 'token' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Publish verified crate with one-time API token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Add CRATES_IO_API_TOKEN in repository Actions secrets before bootstrap publication."
            exit 1
          fi
          cargo +1.98.1 publish --locked
