name: Multi-Platform Build

on:
  push:
    branches: ["main", "copilot/**", "platform/**"]
  pull_request:
    branches: ["main"]
  release:
    types: [created]

permissions:
  contents: read

concurrency:
  group: builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: yukki_core_node-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            artifact: yukki_core_node-linux-arm64
            cross: true
          - target: armv7-unknown-linux-gnueabihf
            artifact: yukki_core_node-linux-armv7
            cross: true
          - target: x86_64-unknown-linux-musl
            artifact: yukki_core_node-linux-x86_64-musl

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Ensure Rust target is installed
        run: rustup target add ${{ matrix.target }}
      - name: Install cross-compilation tools
        if: matrix.cross == true
        run: cargo install cross --locked
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get install -y musl-tools
      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Build (native)
        if: matrix.cross != true
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/yukki_core_node*
          if-no-files-found: warn

  build-macos:
    name: macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            artifact: yukki_core_node-macos-x86_64
          - target: aarch64-apple-darwin
            artifact: yukki_core_node-macos-arm64

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Ensure Rust target is installed
        run: rustup target add ${{ matrix.target }}
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/yukki_core_node

  build-windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Ensure Rust target is installed
        run: rustup target add x86_64-pc-windows-msvc
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: yukki_core_node-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/yukki_core_node.exe

  build-wasm:
    name: WebAssembly guest worker (WASI Preview 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: Ensure WASI target is installed
        run: rustup target add wasm32-wasip1
      - name: Build sandbox guest worker
        working-directory: guest-worker
        run: cargo build --release --locked --target wasm32-wasip1
      - name: Test sandbox guest worker
        working-directory: guest-worker
        run: cargo test --locked
      - name: Upload WASI guest artifact
        uses: actions/upload-artifact@v7
        with:
          name: yukki-guest-worker-wasm32-wasip1
          path: guest-worker/target/wasm32-wasip1/release/yukki_guest_worker.wasm
          if-no-files-found: error

  build-browser-wasm:
    name: Browser application (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Ensure browser WASM target is installed
        run: rustup target add wasm32-unknown-unknown
      - name: Check browser Rust formatting
        run: cargo fmt --manifest-path browser-wasm/Cargo.toml -- --check
      - name: Check browser JavaScript syntax
        run: node --input-type=module --check < browser-wasm/app.js
      - name: Test browser verifier
        run: cargo test --manifest-path browser-wasm/Cargo.toml --locked
      - name: Lint browser verifier
        run: cargo clippy --manifest-path browser-wasm/Cargo.toml --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Build browser verifier
        run: cargo build --manifest-path browser-wasm/Cargo.toml --release --locked --target wasm32-unknown-unknown
      - name: Smoke-test browser WASM exports
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const bytes = await readFile("browser-wasm/target/wasm32-unknown-unknown/release/yukki_browser_core.wasm");
          const { instance } = await WebAssembly.instantiate(bytes, {});
          const { memory, yukki_input_ptr, yukki_input_capacity, yukki_validate_ykmc } = instance.exports;
          if (!(memory instanceof WebAssembly.Memory) || typeof yukki_input_ptr !== "function" ||
              typeof yukki_input_capacity !== "function" || typeof yukki_validate_ykmc !== "function") {
            throw new Error("Required browser WASM exports are missing");
          }
          const frame = new Uint8Array(33);
          const view = new DataView(frame.buffer);
          frame.set([0x59, 0x4b, 0x4d, 0x43, 1, 0, 0], 0);
          view.setUint16(7, 1, false);
          view.setUint16(9, 1, false);
          view.setBigUint64(11, 0n, false);
          view.setBigUint64(19, 0n, false);
          view.setUint32(27, 0, false);
          frame.set([0x61, 0x62], 31);
          const ptr = yukki_input_ptr();
          if (frame.byteLength > yukki_input_capacity()) throw new Error("WASM input area too small");
          new Uint8Array(memory.buffer, ptr, frame.byteLength).set(frame);
          if (yukki_validate_ykmc(frame.byteLength) !== 0) throw new Error("Valid YKMC smoke frame was rejected");
          NODE
      - name: Assemble static browser application
        run: |
          mkdir -p dist
          cp browser-wasm/index.html browser-wasm/app.js browser-wasm/styles.css dist/
          cp browser-wasm/target/wasm32-unknown-unknown/release/yukki_browser_core.wasm dist/
      - name: Upload browser application
        uses: actions/upload-artifact@v7
        with:
          name: yukkios-browser-wasm
          path: dist/
          if-no-files-found: error

  test-library:
    name: Library tests (including gateway CORS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run library unit tests
        run: cargo test --lib --locked

  publish-release-assets:
    name: Publish versioned release archives
    if: >-
      github.event_name == 'release' &&
      needs.build-linux.result == 'success' &&
      needs.build-macos.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-wasm.result == 'success' &&
      needs.build-browser-wasm.result == 'success' &&
      needs.test-library.result == 'success'
    needs: [build-linux, build-macos, build-windows, build-wasm, build-browser-wasm, test-library]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download qualified build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts
      - name: Create release archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for artifact in release-artifacts/*; do
            [ -d "$artifact" ] || continue
            name="$(basename "$artifact")"
            tar -czf "release-assets/${name}.tar.gz" -C "$artifact" .
          done
          cd release-assets
          sha256sum *.tar.gz > SHA256SUMS
      - name: Attach archives to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows, build-wasm, build-browser-wasm, test-library]
    if: always()
    steps:
      - name: Report build results
        run: |
          echo "Linux builds: ${{ needs.build-linux.result }}"
          echo "macOS builds: ${{ needs.build-macos.result }}"
          echo "Windows build: ${{ needs.build-windows.result }}"
          echo "WASI guest build: ${{ needs.build-wasm.result }}"
          echo "Browser WASM build: ${{ needs.build-browser-wasm.result }}"
          echo "Library tests: ${{ needs.test-library.result }}"
