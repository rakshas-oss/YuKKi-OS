name: Regenerate Wasmtime lockfile

on:
  push:
    branches:
      - deps/wasmtime-50-0-3-lock-refresh

permissions:
  contents: write

jobs:
  regenerate:
    if: "!contains(github.event.head_commit.message, '[lockfile-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy

      - name: Regenerate lockfile with Cargo
        run: cargo update -p wasmtime --precise 50.0.3

      - name: Verify resolved Wasmtime version
        run: |
          cargo tree -i wasmtime --locked
          grep -A2 '^name = "wasmtime"$' Cargo.lock

      - name: Compile all targets
        run: cargo check --locked --all-targets

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Commit generated lockfile
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore(deps): refresh Wasmtime lockfile [lockfile-bot]"
            git push
          else
            echo "Cargo.lock already resolves to the requested dependency set."
          fi
