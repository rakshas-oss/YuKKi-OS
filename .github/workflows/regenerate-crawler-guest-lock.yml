name: Regenerate crawler guest lock

on:
  push:
    branches: ["feat/wasm-crawler-fabric"]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Generate and verify guest lockfile with Cargo
        run: |
          cargo +1.98.1 generate-lockfile --manifest-path crawler-wasm/Cargo.toml
          cargo +1.98.1 metadata --manifest-path crawler-wasm/Cargo.toml --format-version 1 --locked
      - name: Commit Cargo-generated guest lockfile
        run: |
          if ! git diff --quiet -- crawler-wasm/Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crawler-wasm/Cargo.lock
            git commit -m "build(crawler): add Cargo-generated guest lockfile"
            git push origin HEAD:feat/wasm-crawler-fabric
          fi
