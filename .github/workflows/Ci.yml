name: YuKKi-OS & Overhauled CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  verify-yukki-os:
    name: Verify YuKKi-OS (Rust & Wasm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Formatting
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --locked

      - name: Run Guest Worker Wasm Tests
        run: cargo test --manifest-path guest-worker/Cargo.toml --locked

      - name: Run Browser Wasm Tests
        run: cargo test --manifest-path browser-wasm/Cargo.toml --locked

  verify-overhauled-asan:
    name: Verify overhauled (C++ ASan & UBSan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev

      - name: Configure CMake with Sanitizers
        run: |
          cmake -S . -B build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DENABLE_CUDA=OFF \
            -DENABLE_TENSORRT=OFF \
            -DBUILD_BROKER=ON \
            -DBUILD_TESTING=ON

      - name: Build with Parallel Jobs
        run: cmake --build build-asan --parallel $(nproc)

      - name: Run CTest Conformance Suite
        run: ctest --test-dir build-asan --output-on-failure
