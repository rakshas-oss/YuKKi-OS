name: Regenerate crawler Cargo lock

on:
  push:
    branches: ["feat/wasm-crawler-fabric"]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve root package dependencies
        run: cargo metadata --format-version 1
      - name: Verify the generated lockfile
        run: cargo metadata --format-version 1 --locked
      - name: Commit Cargo-generated lockfile
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "build(crawler): regenerate Cargo.lock with reqwest"
            git push origin HEAD:feat/wasm-crawler-fabric
          fi
