name: Browser Runtime

on:
  pull_request:
    branches: ["main"]
    paths:
      - "browser-runtime/**"
      - "docs/BROWSER_RUNTIME.md"
      - ".github/workflows/browser-runtime.yml"
  push:
    branches: ["main"]
    paths:
      - "browser-runtime/**"
      - "docs/BROWSER_RUNTIME.md"
      - ".github/workflows/browser-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux browser runtime (WebKitGTK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WebKitGTK development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev
      - name: Check formatting
        run: cargo fmt --manifest-path browser-runtime/Cargo.toml -- --check
      - name: Test runtime contracts
        run: cargo test --manifest-path browser-runtime/Cargo.toml
      - name: Build native browser
        run: cargo build --manifest-path browser-runtime/Cargo.toml --release

  macos:
    name: macOS browser runtime (WKWebView)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: cargo fmt --manifest-path browser-runtime/Cargo.toml -- --check
      - name: Test runtime contracts
        run: cargo test --manifest-path browser-runtime/Cargo.toml
      - name: Build native browser
        run: cargo build --manifest-path browser-runtime/Cargo.toml --release
