<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>YuKKi-OS Gateway Dashboard</title>
  <style>
    :root { font-family: system-ui, sans-serif; color-scheme: dark; background: #101820; color: #e8eef2; }
    body { max-width: 960px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { margin-bottom: .25rem; }
    p { color: #aebdc7; }
    form { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1.25rem 0; }
    input, button { font: inherit; padding: .65rem .8rem; border-radius: .4rem; border: 1px solid #52616b; }
    input { flex: 1 1 18rem; background: #182630; color: inherit; }
    button { cursor: pointer; background: #245b77; color: white; }
    button:disabled { opacity: .55; cursor: wait; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 1rem; border-radius: .5rem; background: #182630; min-height: 5rem; }
    .status { min-height: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>YuKKi-OS Gateway Dashboard</h1>
    <p>Inspect streams exposed by this gateway. The bearer token is kept in page memory only.</p>
    <form id="auth-form">
      <label for="token">Gateway bearer token</label>
      <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Enter gateway token" required>
      <button id="load" type="submit">Load streams</button>
    </form>
    <p id="status" class="status" role="status" aria-live="polite">Enter your gateway token to load stream data.</p>
    <section aria-labelledby="streams-heading">
      <h2 id="streams-heading">Streams</h2>
      <pre id="streams">No stream data loaded.</pre>
    </section>
  </main>
  <script>
    (() => {
      const form = document.getElementById("auth-form");
      const tokenInput = document.getElementById("token");
      const loadButton = document.getElementById("load");
      const status = document.getElementById("status");
      const output = document.getElementById("streams");
      let bearerToken = "";

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        bearerToken = tokenInput.value.trim();
        if (!bearerToken) return;
        loadButton.disabled = true;
        status.textContent = "Loading streams…";
        output.textContent = "";
        try {
          const response = await fetch("/v1/streams", {
            headers: { Authorization: "Bearer " + bearerToken },
            cache: "no-store"
          });
          if (response.status === 401) throw new Error("Authentication failed. Check the gateway token.");
          if (!response.ok) throw new Error("Gateway returned HTTP " + response.status + ".");
          const streams = await response.json();
          output.textContent = JSON.stringify(streams, null, 2);
          status.textContent = Array.isArray(streams)
            ? streams.length + " stream(s) loaded."
            : "Stream data loaded.";
        } catch (error) {
          bearerToken = "";
          output.textContent = "No stream data available.";
          status.textContent = error instanceof Error ? error.message : "Unable to load streams.";
        } finally {
          loadButton.disabled = false;
        }
      });

      window.addEventListener("pagehide", () => { bearerToken = ""; });
    })();
  </script>
</body>
</html>
